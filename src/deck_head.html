<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TraceAI — AI-Powered Production Debugging Ecosystem</title>
<style>
:root{
  --red:#E31B23; --red-ink:#B3151C; --red-wash:#FDEFEF;
  --ink:#0E1013; --ink-2:#3B4149; --muted:#767D87; --faint:#A2A9B2;
  --line:#E5E7EA; --line-soft:#F0F1F3;
  --bg:#FFFFFF; --surface:#F7F8F9; --surface-2:#FBFBFC;
  --ok:#0E8A5F; --ok-wash:#EAF6F1;
  --pad: clamp(28px, 4.2vw, 76px);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font); -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit; cursor:pointer}

/* ---------- chrome ---------- */
#progress{position:fixed; top:0; left:0; height:2px; background:var(--red); width:0; z-index:60; transition:width .35s cubic-bezier(.4,0,.2,1)}
#topbar{
  position:fixed; top:0; left:0; right:0; height:56px; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 clamp(16px,2.4vw,32px); pointer-events:none;
}
.brand{display:flex; align-items:center; gap:9px; pointer-events:auto}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--red)}
.brand b{font-size:14px; letter-spacing:-.01em; font-weight:650}
.brand span{font-size:12px;color:var(--faint)}
.ctrls{display:flex; align-items:center; gap:8px; pointer-events:auto}
.pill{
  display:inline-flex; align-items:center; gap:2px; border:1px solid var(--line);
  border-radius:999px; padding:3px; background:rgba(255,255,255,.86); backdrop-filter:blur(8px);
}
.pill button{
  border:0; background:none; font-size:11.5px; font-weight:600; letter-spacing:.02em;
  color:var(--muted); padding:4px 10px; border-radius:999px; transition:.15s;
}
.pill button[aria-pressed="true"]{background:var(--ink); color:#fff}
.gbtn{
  border:1px solid var(--line); background:rgba(255,255,255,.86); backdrop-filter:blur(8px);
  border-radius:999px; padding:6px 13px; font-size:11.5px; font-weight:600; color:var(--ink-2);
  transition:.15s;
}
.gbtn:hover{border-color:var(--ink); color:var(--ink)}
#counter{font-family:var(--mono); font-size:11.5px; color:var(--faint); letter-spacing:.04em; min-width:52px; text-align:right}

#nav{position:fixed; right:clamp(16px,2.4vw,32px); bottom:20px; z-index:50; display:flex; gap:8px}
#nav button{
  width:34px;height:34px;border-radius:50%; border:1px solid var(--line); background:rgba(255,255,255,.9);
  backdrop-filter:blur(8px); color:var(--ink-2); font-size:15px; line-height:1; transition:.15s;
}
#nav button:hover:not(:disabled){border-color:var(--ink); color:var(--ink)}
#nav button:disabled{opacity:.3; cursor:default}
#hint{position:fixed; left:clamp(16px,2.4vw,32px); bottom:24px; z-index:50; font-size:11px; color:var(--faint)}
#hint kbd{font-family:var(--mono); font-size:10px; border:1px solid var(--line); border-radius:4px; padding:1px 4px; color:var(--muted)}

/* ---------- slides ---------- */
#deck{height:100%}
.slide{
  position:absolute; inset:0; padding:clamp(72px,9vh,96px) var(--pad) clamp(56px,7vh,72px);
  display:none; flex-direction:column; overflow:hidden;
}
.slide.on{display:flex; animation:rise .42s cubic-bezier(.22,.8,.28,1) both}
@keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){ .slide.on{animation:none} #progress{transition:none} }

.kicker{
  font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--red); margin:0 0 14px;
}
h1{font-size:clamp(38px,5.6vw,76px); line-height:1.02; letter-spacing:-.033em; font-weight:680; margin:0}
h2{font-size:clamp(26px,3.4vw,46px); line-height:1.08; letter-spacing:-.026em; font-weight:660; margin:0 0 clamp(14px,2vh,22px); max-width:26ch}
.lede{font-size:clamp(15px,1.35vw,19px); line-height:1.5; color:var(--ink-2); max-width:62ch; margin:0 0 clamp(18px,2.6vh,30px)}
.body{flex:1; min-height:0; display:flex; flex-direction:column}
.small{font-size:12px; color:var(--muted); line-height:1.5}
.foot{margin-top:auto; padding-top:14px; font-size:11px; color:var(--faint); line-height:1.55; border-top:1px solid var(--line-soft)}

/* title slide */
.title-slide{justify-content:center}
.title-slide h1{margin-bottom:clamp(16px,2.4vh,26px)}
.title-slide .lede{font-size:clamp(16px,1.6vw,22px); color:var(--ink-2); max-width:56ch}
.tstats{display:flex; flex-wrap:wrap; gap:clamp(24px,4vw,64px); margin-top:clamp(28px,5vh,54px); padding-top:clamp(20px,3vh,30px); border-top:1px solid var(--line)}
.tstat .n{font-family:var(--mono); font-size:clamp(22px,2.6vw,34px); font-weight:600; letter-spacing:-.02em}
.tstat .n em{font-style:normal; color:var(--red)}
.tstat .l{font-size:11.5px; color:var(--muted); margin-top:5px; letter-spacing:.01em}

/* grids */
.grid{display:grid; gap:clamp(12px,1.5vw,20px)}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){ .g3,.g4{grid-template-columns:repeat(2,1fr)} }

.card{
  border:1px solid var(--line); border-radius:14px; padding:clamp(14px,1.6vw,22px);
  background:var(--surface-2); display:flex; flex-direction:column; min-width:0;
}
.card h3{margin:0 0 8px; font-size:clamp(14px,1.15vw,17px); font-weight:640; letter-spacing:-.012em}
.card p{margin:0; font-size:clamp(12px,1vw,14.5px); line-height:1.55; color:var(--ink-2)}
.card .num{font-family:var(--mono); font-size:11px; color:var(--red); font-weight:600; margin-bottom:9px; letter-spacing:.05em}
.card.accent{background:var(--red-wash); border-color:#F6D9DA}
.card.dark{background:var(--ink); border-color:var(--ink)}
.card.dark h3,.card.dark p{color:#fff}
.card.dark p{color:#C9CDD3}

/* Cards in a marked group rise in one after another. Keyed off .slide.on, so a
   slide replays its reveal every time it is shown — an inactive slide is
   display:none, which drops the animation and lets it restart on return. */
@keyframes cardRise{ from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none} }
/* No resting opacity:0 — the backwards half of fill-mode:both supplies the
   hidden state during the delay, so a card is never left invisible if the
   animation is blocked or unsupported. */
.slide.on .reveal > *{animation:cardRise .6s cubic-bezier(.22,.8,.28,1) both}
.slide.on .reveal > *:nth-child(1){animation-delay:0.15s}
.slide.on .reveal > *:nth-child(2){animation-delay:1.15s}
.slide.on .reveal > *:nth-child(3){animation-delay:2.15s}
.slide.on .reveal > *:nth-child(4){animation-delay:3.15s}
.slide.on .reveal > *:nth-child(5){animation-delay:4.15s}
.slide.on .reveal > *:nth-child(6){animation-delay:5.15s}
.slide.on .reveal > *:nth-child(7){animation-delay:6.15s}
.slide.on .reveal > *:nth-child(8){animation-delay:7.15s}
@media (prefers-reduced-motion:reduce){
  .slide.on .reveal > *{animation:none}
}

ul.ticks{margin:0; padding:0; list-style:none}
ul.ticks li{
  position:relative; padding-left:20px; margin-bottom:9px;
  font-size:clamp(12.5px,1.05vw,15px); line-height:1.5; color:var(--ink-2);
}
ul.ticks li:last-child{margin-bottom:0}
ul.ticks li::before{
  content:""; position:absolute; left:2px; top:.62em; width:6px; height:6px;
  border-radius:50%; background:var(--red); opacity:.85;
}
ul.ticks.plain li::before{background:var(--faint)}

/* stat row */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(12px,1.6vw,22px)}
@media (max-width:900px){ .stats{grid-template-columns:repeat(2,1fr)} }
.stat{border-left:2px solid var(--red); padding-left:clamp(12px,1.2vw,18px)}
.stat .n{font-family:var(--mono); font-size:clamp(26px,3.2vw,44px); font-weight:600; letter-spacing:-.03em; line-height:1}
.stat .u{font-size:.5em; color:var(--muted); font-weight:500; letter-spacing:0}
.stat .l{font-size:12px; color:var(--muted); margin-top:9px; line-height:1.45}

/* diagram frame */
.diagram-wrap{
  flex:1; min-height:0; border:1px solid var(--line); border-radius:14px; overflow:hidden;
  background:var(--surface); position:relative; display:flex;
}
.diagram-wrap iframe{position:absolute; left:0; top:0; width:100%; height:100%; border:0; display:block; background:#fff; transform-origin:0 0}
.diagram-wrap .loading{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:12.5px; color:var(--faint); gap:9px;
}
.diagram-wrap .loading::before{
  content:""; width:11px;height:11px;border-radius:50%;
  border:1.5px solid var(--line); border-top-color:var(--red); animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.slide.diagram{padding-top:clamp(52px,6.2vh,62px); padding-bottom:clamp(26px,3.2vh,38px)}
.slide.diagram h2{font-size:clamp(20px,2.2vw,30px); margin-bottom:7px; max-width:40ch}
.slide.diagram .kicker{margin-bottom:8px}
.dbar{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:10px}
.dbar .small{max-width:none}
.expand{
  border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 13px;
  font-size:11.5px; font-weight:600; color:var(--ink-2); white-space:nowrap; transition:.15s;
}
.expand:hover{border-color:var(--ink); color:var(--ink)}
body.zoomed .slide.on{padding:0}
body.zoomed .slide.on > :not(.diagram-wrap){display:none}
body.zoomed .diagram-wrap{border-radius:0; border:0}
body.zoomed #topbar, body.zoomed #hint{opacity:0; pointer-events:none}
#zoomout{
  display:none; position:fixed; left:18px; bottom:18px; z-index:70;
  border:1px solid var(--line); background:rgba(255,255,255,.94); backdrop-filter:blur(8px);
  border-radius:999px; padding:7px 15px; font-size:11.5px; font-weight:600; color:var(--ink);
}
body.zoomed #zoomout{display:block}

/* table */
.tbl-wrap{flex:1; min-height:0; overflow:auto; border:1px solid var(--line); border-radius:14px}
table{border-collapse:collapse; width:100%; font-size:clamp(11px,.92vw,13.5px)}
th,td{padding:11px 14px; text-align:left; border-bottom:1px solid var(--line-soft); vertical-align:top; line-height:1.45}
thead th{
  position:sticky; top:0; background:#fff; z-index:2; font-size:10.5px; font-weight:700;
  letter-spacing:.07em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line);
}
tbody tr:last-child td{border-bottom:0}
tbody tr.us{background:var(--red-wash)}
tbody tr.us td{color:var(--ink); font-weight:500}
tbody tr.us td:first-child{font-weight:680}
td.name{font-weight:600; color:var(--ink); white-space:nowrap}
td.name em{display:block; font-style:normal; font-weight:400; font-size:.88em; color:var(--muted); margin-top:2px; white-space:normal}
.chip{display:inline-block; font-family:var(--mono); font-size:.92em; padding:1px 6px; border-radius:5px; background:var(--surface); border:1px solid var(--line)}
.chip.good{background:var(--ok-wash); border-color:#CDE8DE; color:var(--ok)}
table.matrix{table-layout:fixed; font-size:clamp(10.5px,.86vw,13px)}
table.matrix th, table.matrix td{padding:11px 13px; vertical-align:top; line-height:1.5}
table.matrix thead th{
  position:sticky; top:0; background:#fff; z-index:2; font-size:clamp(11px,.95vw,14px);
  font-weight:650; letter-spacing:-.01em; text-transform:none; color:var(--ink);
  border-bottom:1px solid var(--line); white-space:normal;
}
table.matrix thead th:first-child{width:15%}
table.matrix thead th .hd{display:flex; align-items:center; gap:7px; min-width:0}
table.matrix thead th .logo{width:16px; height:16px; flex:none; display:block}
table.matrix thead th .logo.tm{width:11px; height:11px; margin:0 2px; border-radius:50%; background:var(--red)}
table.matrix thead th.mutedlogo .logo{color:var(--faint)}
table.matrix thead th .nm{min-width:0}
table.matrix thead th em{
  display:block; font-style:normal; font-weight:400; font-size:.8em;
  color:var(--faint); margin-top:3px;
}
table.matrix thead th.usc{color:var(--red)}
table.matrix thead th.usc em{color:var(--red-ink); opacity:.7}
table.matrix tbody th[scope="row"]{
  position:static; background:none; text-transform:none; letter-spacing:0;
  font-size:.96em; font-weight:600; color:var(--ink-2); text-align:left;
  border-bottom:1px solid var(--line-soft);
}
table.matrix tbody td.usc{background:var(--red-wash); color:var(--ink); font-weight:500}
table.matrix tbody td.mute{color:var(--faint)}
table.matrix tbody tr:last-child th, table.matrix tbody tr:last-child td{border-bottom:0}
.chip.warn{background:var(--red-wash); border-color:#F6D9DA; color:var(--red-ink)}

/* calculator */
.calc{border:1px solid var(--line); border-radius:14px; padding:clamp(16px,1.8vw,24px); background:var(--surface-2)}
.calc-head{display:flex; align-items:baseline; justify-content:space-between; gap:14px; margin-bottom:16px}
.calc-head .q{font-size:13px; font-weight:600}
.calc-head output{font-family:var(--mono); font-size:15px; font-weight:600; color:var(--red)}
input[type=range]{width:100%; accent-color:var(--red); height:20px}
.calc-out{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:18px; padding-top:16px; border-top:1px solid var(--line)}
.calc-out div .n{font-family:var(--mono); font-size:clamp(17px,1.9vw,25px); font-weight:600; letter-spacing:-.02em}
.calc-out div .l{font-size:11px; color:var(--muted); margin-top:5px; line-height:1.4}
.calc-out div.hl .n{color:var(--red)}

/* toc */
.cmp-detail{padding:4px 0 8px}
.cmp-sum{display:grid; grid-template-columns:1fr 1fr; gap:9px 22px; margin-bottom:13px}
.cmp-sum > div{display:flex; gap:9px; align-items:baseline; line-height:1.6}
.cmp-sum span:last-child{color:var(--ink-2)}
.tag-same,.tag-diff{
  flex:none; font-size:9.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  padding:2px 7px; border-radius:4px; position:relative; top:-1px;
}
.tag-same{background:var(--ok-wash); color:var(--ok); border:1px solid #CDE8DE}
.tag-diff{background:var(--red-wash); color:var(--red-ink); border:1px solid #F6D9DA}
table.cmp-vs{width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden}
table.cmp-vs th, table.cmp-vs td{padding:7px 11px; font-size:.94em; line-height:1.5; border-bottom:1px solid var(--line-soft); vertical-align:top; text-align:left}
table.cmp-vs thead th{
  position:static; background:var(--surface); font-size:9.5px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line); white-space:nowrap;
}
table.cmp-vs thead th:last-child{color:var(--red)}
table.cmp-vs td:first-child{color:var(--muted); white-space:nowrap; width:1%}
table.cmp-vs td:last-child{background:var(--red-wash); color:var(--ink)}
table.cmp-vs tbody tr:last-child td{border-bottom:0}
@media (max-width:900px){ .cmp-sum{grid-template-columns:1fr} }
#toc{
  position:fixed; inset:0; z-index:80; background:rgba(255,255,255,.97); backdrop-filter:blur(14px);
  display:none; padding:clamp(48px,7vh,80px) var(--pad); overflow:auto;
}
#toc.on{display:block; animation:rise .25s ease both}
#toc h3{margin:0 0 clamp(20px,3vh,32px); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--red); font-weight:700}
#toc ol{margin:0; padding:0; list-style:none; columns:2; column-gap:clamp(24px,4vw,64px)}
@media (max-width:780px){ #toc ol{columns:1} }
#toc li{break-inside:avoid; margin-bottom:2px}
#toc button{
  display:flex; gap:14px; align-items:baseline; width:100%; text-align:left; border:0; background:none;
  padding:9px 10px; border-radius:9px; color:var(--ink-2); font-size:14px; transition:.12s;
}
#toc button:hover{background:var(--surface); color:var(--ink)}
#toc button[aria-current="true"]{color:var(--ink); font-weight:640}
#toc button[aria-current="true"] .i{color:var(--red)}
#toc .i{font-family:var(--mono); font-size:11px; color:var(--faint); min-width:20px}
</style>
</head>
<body>
<div id="progress"></div>
<header id="topbar">
  <div class="brand"><span class="dot"></span><b>TraceAI</b><span data-vi="· TCBS" data-en="· TCBS"></span></div>
  <div class="ctrls">
    <span class="pill" role="group" aria-label="Language">
      <button id="lang-vi" aria-pressed="true">VI</button>
      <button id="lang-en" aria-pressed="false">EN</button>
    </span>
    <button class="gbtn" id="toc-btn" data-vi="Mục lục" data-en="Contents"></button>
    <span id="counter">01 / 16</span>
  </div>
</header>
<button id="zoomout" data-vi="Đóng  ✕" data-en="Close  ✕"></button>
<nav id="nav"><button id="prev" aria-label="Previous">‹</button><button id="next" aria-label="Next">›</button></nav>
<div id="hint"><kbd>←</kbd> <kbd>→</kbd> <span data-vi="chuyển slide" data-en="to navigate"></span></div>
<nav id="toc" aria-hidden="true"><h3 data-vi="Nội dung" data-en="Contents"></h3><ol id="toc-list"></ol></nav>
<main id="deck">
