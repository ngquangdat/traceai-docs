<!-- 03 -->
<section class="slide" data-title-vi="Giải pháp" data-title-en="The solution">
  <p class="kicker" data-vi="Giải pháp" data-en="The solution"></p>
  <h2 data-vi="Một kỹ sư điều tra, luôn trực" data-en="An investigating engineer, always on call"></h2>
  <p class="lede" data-vi="TraceAI không phải một dashboard nữa. Nó là một agent tự chọn công cụ, tự đọc log và mã nguồn, rồi trả lại một báo cáo mà mọi câu đều có bằng chứng đi kèm." data-en="TraceAI is not another dashboard. It is an agent that chooses its own tools, reads logs and source code, and returns a report in which every claim carries its evidence."></p>
  <div class="body">
    <div class="grid reveal g3" style="align-content:start">
      <div class="card">
        <div class="num">01</div>
        <h3 data-vi="Xuyên tầng" data-en="Cross-stack"></h3>
        <p data-vi="Một trace ID chạy xuyên suốt: từ lỗi frontend trên Sentry, qua từng service backend mà request đó đi qua trong Kibana và APM, tới hành vi người dùng trên Matomo và dòng code trên Bitbucket." data-en="One trace ID runs the whole way: from a frontend error in Sentry, through every backend service that request passed through in Kibana and APM, to the user behaviour in Matomo and the line of code in Bitbucket."></p>
      </div>
      <div class="card">
        <div class="num">02</div>
        <h3 data-vi="Gắn với bằng chứng" data-en="Bound to evidence"></h3>
        <p data-vi="Mọi kết luận trỏ về một dòng log thật hoặc một file:line thật. Khi thiếu bằng chứng, agent buộc phải nói thiếu gì thay vì đoán." data-en="Every conclusion points to a real log line or a real file:line. When evidence is missing, the agent must say what is missing instead of guessing."></p>
      </div>
      <div class="card">
        <div class="num">03</div>
        <h3 data-vi="Khép vòng" data-en="Closed loop"></h3>
        <p data-vi="Chọn một khuyến nghị, TraceAI tạo branch, commit và pull request nháp trên Bitbucket. Phần này đang dần hoàn thiện — hiện mới xử lý được các sửa đơn giản, và quyền merge luôn thuộc về con người." data-en="Select a recommendation and TraceAI opens a branch, a commit and a draft pull request on Bitbucket. This part is still maturing — today it covers simple fixes only, and merge rights always stay human."></p>
      </div>
    </div>
    <div class="foot" data-vi="Xây trên LangGraph + FastAPI + React, mô hình Claude chạy qua AWS Bedrock trong chính tài khoản AWS của TCBS. Không mua license của bên thứ ba nào." data-en="Built on LangGraph + FastAPI + React, with Claude served through AWS Bedrock inside TCBS's own AWS account. No third-party licence was purchased."></div>
  </div>
</section>

<section class="slide diagram" data-title-vi="Kiến trúc hệ thống" data-title-en="System architecture">
  <p class="kicker" data-vi="Kiến trúc" data-en="Architecture"></p>
  <h2 style="margin-bottom:10px" data-vi="Agent chạy bằng quyền của chính người hỏi" data-en="The agent runs on the caller's own permissions"></h2>
  <div class="dbar">
    <p class="small" style="max-width:74ch" data-vi="Agent không có quyền riêng của nó. Mọi lời gọi tới Kibana, Sentry, Matomo và Bitbucket đều đi bằng token của chính người đang hỏi, nên nó không bao giờ đọc được nhiều hơn người đó được phép đọc." data-en="The agent holds no permissions of its own. Every call to Kibana, Sentry, Matomo and Bitbucket travels on the token of whoever asked, so it can never read more than that person already can."></p>
    <button class="expand" data-zoom data-vi="Xem đầy đủ" data-en="Full view"></button>
  </div>

  <h2 style="margin-bottom:10px" data-vi="Thu hẹp dần, không bao giờ đọc cả biển log" data-en="Narrow at every step, never read the whole ocean"></h2>

<section class="slide" data-title-vi="Hai chế độ theo vai trò" data-title-en="Two role-based modes">
  <p class="kicker" data-vi="Người dùng" data-en="Who uses it"></p>
  <h2 data-vi="Cùng một sự cố, hai câu trả lời khác nhau" data-en="One incident, two different answers"></h2>
  <p class="lede" data-vi="Vai trò được thực thi ở middleware, không phải bằng cách ẩn nút trên giao diện. Chế độ Support không bao giờ nhìn thấy mã nguồn." data-en="Roles are enforced in middleware, not by hiding buttons in the UI. Support mode never sees source code."></p>
  <div class="body">
    <div class="grid reveal g2" style="align-content:start">
      <div class="card">
        <div class="num" data-vi="CHẾ ĐỘ SUPPORT" data-en="SUPPORT MODE"></div>
        <h3 data-vi="Trả lời được khách hàng ngay" data-en="Answer the customer immediately"></h3>
        <ul class="ticks" style="margin-top:12px">
          <li data-vi="Đội nào sở hữu lỗi này" data-en="Which team owns this error"></li>
          <li data-vi="Bao nhiêu khách hàng đang bị ảnh hưởng" data-en="How many customers are affected"></li>
          <li data-vi="Khách hàng đã thao tác gì trước khi lỗi xảy ra" data-en="What the customer was doing before it broke"></li>
          <li data-vi="Hướng xử lý đề xuất, không cần kiến thức kỹ thuật" data-en="Suggested handling, with no engineering knowledge required"></li>
        </ul>
      </div>
      <div class="card">
        <div class="num" data-vi="CHẾ ĐỘ DEV" data-en="DEV MODE"></div>
        <h3 data-vi="Đi tới tận dòng code" data-en="Go all the way to the line of code"></h3>
        <ul class="ticks" style="margin-top:12px">
          <li data-vi="Phân tích nguyên nhân gốc đầy đủ, kèm bảng bằng chứng" data-en="Full root-cause analysis with an evidence table"></li>
          <li data-vi="Đoạn code liên quan, tự lấy về từ git theo đúng commit" data-en="The affected code, fetched from git at the right commit"></li>
          <li data-vi="Mô tả luồng xuyên service và input thật của request" data-en="Cross-service flow and the request's real input"></li>
          <li data-vi="Khuyến nghị sửa, mức độ tin cậy, và các bước tái hiện" data-en="Recommended fixes, a confidence level, and reproduction steps"></li>
        </ul>
      </div>
    </div>
    <div class="foot" data-vi="Đăng nhập bằng Microsoft Entra ID (MSAL + JWT). Mỗi người dùng tự nhập token riêng cho Kibana, Sentry, Matomo và Bitbucket; token được mã hoá AES-256-GCM khi lưu." data-en="Sign-in through Microsoft Entra ID (MSAL + JWT). Each user supplies their own tokens for Kibana, Sentry, Matomo and Bitbucket, stored AES-256-GCM encrypted."></div>
  </div>
</section>
